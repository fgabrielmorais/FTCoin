# Contenido del manual de ayuda
gui.ajuda.manual.titulo=Manual del usuario
gui.ajuda.manual.versao=Versión
gui.ajuda.manual.secao1.titulo=1. Visión general
gui.ajuda.manual.secao1.html=<p>FTCoin Studio es una aplicación académica para gestionar carteras de la moneda virtual FTCoin, registrar compras y ventas, consultar cotizaciones y seguir los resultados. Use los botones de la barra superior para abrir cada pantalla.</p>
gui.ajuda.manual.secao2.titulo=2. Carteras
gui.ajuda.manual.secao2.html=<ul><li><b>Crear:</b> abra Carteras, pulse Nueva cartera, indique el titular y la plataforma y confirme.</li><li><b>Editar:</b> seleccione una cartera en la tabla y pulse Editar para modificar sus datos.</li><li><b>Eliminar:</b> seleccione la cartera y confirme la eliminación. No se pueden eliminar carteras con operaciones registradas.</li></ul>
gui.ajuda.manual.secao3.titulo=3. Compras, ventas y fechas
gui.ajuda.manual.secao3.html=<p>Abra Operaciones, elija Compra o Venta, seleccione la cartera e introduzca una cantidad positiva. Use punto o coma como separador decimal, sin separadores de miles: por ejemplo, <b>10.5</b> o <b>10,5</b>. Revise los datos y confirme la operación. Se rechazan las ventas que superen el saldo disponible.</p><p>Introduzca las fechas con el formato <b>AAAA-MM-DD</b>, por ejemplo, <b>2026-11-01</b>, independientemente del idioma. El formulario de operaciones rechaza fechas futuras.</p><p><b>Limitación actual:</b> la fecha indicada puede utilizarse en la estimación, pero la compra o venta se registra con la fecha actual del equipo y se valida con la cotización actual. Para mantener la estimación coherente con el registro, use la fecha de hoy. El formulario no permite registrar una operación con fecha anterior.</p>
gui.ajuda.manual.secao4.titulo=4. Cotizaciones y caché
gui.ajuda.manual.secao4.html=<p>En la pantalla Cotización, introduzca la fecha con el formato AAAA-MM-DD y pulse Consultar. La pantalla muestra el valor, el origen de la respuesta, la latencia y la hora de consulta.</p><ul><li><b>Oráculo:</b> consulta a la fuente de cotizaciones configurada. En memoria, los valores son simulados; en MariaDB, se leen de la base de datos. No es una integración con una bolsa ni con un servicio financiero externo.</li><li><b>Caché:</b> reutilización temporal de una cotización ya consultada, con una validez de 60 segundos.</li><li><b>Vaciar caché:</b> elimina las entradas temporales y vuelve a consultar la fecha actual.</li></ul><p>La consulta asíncrona al Oráculo incluye una espera simulada. Si no existe una cotización en la base de datos para la fecha solicitada, la consulta puede fallar. El historial reciente utiliza un valor alternativo de 5,50 cuando la consulta no devuelve una cotización; por tanto, no debe interpretarse como una serie de precios reales de mercado.</p>
gui.ajuda.manual.secao5.titulo=5. Uso de los informes
gui.ajuda.manual.secao5.html=<p>Abra Informes y seleccione una cartera para los informes 1 y 2. Use Actualizar todos para recargar los datos.</p><ol><li><b>Posición consolidada:</b> saldo, coste medio, valor al coste, valor de mercado, ganancias y ROI de la cartera seleccionada.</li><li><b>Historial de operaciones:</b> fechas, compras y ventas, cantidades, cotizaciones e importes de la cartera seleccionada.</li><li><b>Resumen de la cartera de inversiones:</b> todas las carteras y su participación en el valor de mercado total.</li><li><b>Rendimiento y rentabilidad:</b> valor al coste, valor actual, resultado total y ROI por cartera. La tabla no está necesariamente ordenada por rentabilidad.</li><li><b>Historial del Oráculo:</b> tabla de cotizaciones recientes, variaciones absolutas y porcentuales y origen indicado por el sistema.</li></ol>
gui.ajuda.manual.secao6.titulo=6. Coste medio y resultados
gui.ajuda.manual.secao6.html=<p><b>Coste medio ponderado (CMP):</b> valor al coste dividido por el saldo de FTC. La compra aumenta el saldo y el valor al coste, recalculando el CMP. La venta reduce el saldo y el valor al coste proporcionalmente, manteniendo el CMP, sujeto a redondeos.</p><ul><li><b>Resultado realizado:</b> suma de los resultados de las ventas. Cada venta calcula cantidad vendida × (cotización de venta − coste medio).</li><li><b>Resultado no realizado:</b> valor de mercado de la posición restante menos su valor al coste.</li><li><b>Resultado total:</b> realizado más no realizado.</li><li><b>ROI en esta aplicación:</b> resultado total dividido por el valor al coste de la posición restante, multiplicado por 100. Cuando ese valor al coste es cero, el sistema muestra un ROI de cero.</li></ul><p>Los resultados negativos representan pérdidas. Los colores facilitan la lectura, pero compruebe también el signo y el valor mostrados.</p>
gui.ajuda.manual.secao7.titulo=7. Idioma y almacenamiento
gui.ajuda.manual.secao7.html=<p>Use el selector Idioma de la barra superior para elegir portugués, inglés o español sin reiniciar. Cierre los diálogos modales, como este manual, para acceder al selector; después vuelva a abrir la ayuda. El idioma modifica la presentación de textos, números y fechas, sin representar una conversión monetaria.</p><p>El selector de base de datos alterna entre Memoria y MariaDB. El cambio selecciona otra fuente de datos; no transfiere automáticamente los registros entre modos.</p><ul><li><b>Memoria:</b> destinada a pruebas y simulaciones. Los datos no se guardan de forma permanente y se pierden al cerrar el programa.</li><li><b>MariaDB:</b> los registros se guardan en la base de datos configurada. Si falla la conexión, compruebe que el servidor está disponible y pida al responsable de la instalación que revise la dirección, la base de datos, las credenciales y los permisos. No comparta contraseñas en capturas de pantalla.</li></ul>
gui.ajuda.manual.secao8.titulo=8. Cierre
gui.ajuda.manual.secao8.html=<p>Para cerrar solo este manual, use Cerrar manual o la X de esta ventana. Para salir del programa, use la X de la ventana principal. Complete las operaciones antes de salir: los campos sin confirmar no son registros guardados y los datos del modo memoria no estarán disponibles en una nueva ejecución.</p>