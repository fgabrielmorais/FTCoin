# Onde o sistema guarda os dados:
#   memory  - dados em memória, perdidos ao encerrar (não exige banco)
#   mariadb - MariaDB, usando as credenciais de database.properties
storage.provider=memory

# De onde vêm as cotações:
#   simulado - cotações calculadas localmente (não exige rede)
#   api      - servidor de cotações; endereço e credenciais em oracle.properties
oracle.provider=simulado
