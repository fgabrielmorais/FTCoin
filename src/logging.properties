# =====================================================================
# Configuração de logs do FTCoin (java.util.logging)
# Carregada na partida por br.com.ftcoin.config.ConfiguracaoLog
# =====================================================================

# 1. CONFIGURAÇÃO GLOBAL (root logger)
# Destinos das mensagens: console e arquivo com rotação
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler
# Nível global: o que estiver abaixo de INFO é descartado (inclui bibliotecas do JDK e do driver)
.level = INFO

# 2. CONFIGURAÇÃO DOS HANDLERS (destinos)
# Console: só eventos de negócio e problemas (INFO, WARNING, SEVERE)
java.util.logging.ConsoleHandler.level = INFO
# Arquivo: aceita tudo (ALL); quem filtra é o nível de cada logger
java.util.logging.FileHandler.level = ALL
# %g = número da rotação (0 = mais recente). A pasta logs/ é criada na partida
java.util.logging.FileHandler.pattern = logs/ftcoin-%g.log
# Rotação: novo arquivo a cada ~1 MB, guardando até 5
java.util.logging.FileHandler.limit = 1000000
java.util.logging.FileHandler.count = 5
# true = continua o arquivo existente entre execuções
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.encoding = UTF-8
# O layout da linha é definido pela classe br.com.ftcoin.config.FormatadorLog:
#   2026-11-02 10:18:09.096 [INFO] [main] br.com.ftcoin.gui.main.FTCoinGuiApp - mensagem

# 3. HIERARQUIA POR PACOTES (sobrescreve o nível global)
# Desenvolvimento: o projeto registra até FINE. Em produção, troque para INFO
br.com.ftcoin.level = FINE
# Para investigar uma camada em detalhe, descomente a linha correspondente:
#br.com.ftcoin.daos.level = FINEST
